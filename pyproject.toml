[project]
name = "permitflow"
version = "0.1.0"
description = "Feishu permission request assistant backed by Jira"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "httpx>=0.27",
  "langgraph>=0.2.50",
  "langgraph-checkpoint-postgres>=2.0",
  "openai>=1.55",
  "prometheus-client>=0.21",
  "psycopg[binary,pool]>=3.2",
  "pydantic-settings>=2.6",
  "python-json-logger>=2.0",
  "uvicorn[standard]>=0.32",
]

[dependency-groups]
dev = [
  "pytest>=8.3",
  "pytest-asyncio>=0.24",
  "respx>=0.21",
  "ruff>=0.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/permitflow"]

[tool.pytest.ini_options]
pythonpath = ["src"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

